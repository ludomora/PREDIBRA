        <span class="a11y-label">Texto</span>
        <button class="a11y-btn" onclick="adjustFontSize(-1)" aria-label="Diminuir o tamanho do texto" title="Diminuir texto">A−</button>
        <button class="a11y-btn" onclick="adjustFontSize(1)" aria-label="Aumentar o tamanho do texto" title="Aumentar texto">A+</button>
        <button class="a11y-btn" id="theme-toggle" onclick="toggleTheme()" aria-pressed="false" aria-label="Ativar modo escuro" title="Modo escuro">
          <svg class="icon"><use href="#icon-moon" /></svg>
        </button>
      </div>
      <button class="mh-btn" onclick="openPdfDialog()">
        <svg class="icon"><use href="#icon-download" /></svg> <span class="btn-text">Baixar PDF</span>
      </button>
    </div>
  </header>

  <!-- Breadcrumbs + reading progress -->
  <div class="mh-subbar">
    <div class="breadcrumbs" id="app-breadcrumbs"></div>
    <div class="mh-subbar-right">
      <div class="section-stats-badge" id="header-read-time"></div>
      <button class="nav-action-btn" onclick="shareSection()" title="Copiar link para esta página">
        <svg class="icon"><use href="#icon-share" /></svg> <span class="btn-text">Copiar link</span>
      </button>
    </div>
  </div>
  <div class="progress-bar-container">
    <div class="progress-bar-fill" id="reading-progress-bar"></div>
  </div>

  <div class="app-container">
    <aside class="sidebar" id="app-sidebar" aria-label="Sumário do manual">
      <div class="search-box-container">
        <div class="search-input-wrapper">
          <svg class="icon search-input-icon" aria-hidden="true"><use href="#icon-search" /></svg>
          <input type="text" id="manual-search" placeholder="Buscar no manual..." oninput="performSearch()" aria-label="Buscar no manual">
          <button id="search-clear-btn" onclick="clearSearch()" style="display:none;" aria-label="Limpar busca">
            <svg class="icon"><use href="#icon-x" /></svg>
          </button>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
    </aside>
    <div class="sidebar-backdrop" onclick="toggleSidebar(false)"></div>

    <div class="main-layout">
      <div class="search-results-overlay" id="search-hud" style="display:none;">
        <div class="hud-header">
          <span class="hud-title">
            <svg class="icon"><use href="#icon-search" /></svg>
            Resultados da busca (<span id="search-count">0</span>)
          </span>
          <button class="hud-close-btn" onclick="clearSearch()">
            <svg class="icon"><use href="#icon-x" /></svg> Fechar
          </button>
        </div>
        <div class="hud-results-list" id="search-results-list"></div>
      </div>

      <main class="content-viewport" id="content-viewport"></main>
    </div>
  </div>

  <!-- PDF dialog -->
  <div class="pdf-overlay" id="pdf-overlay" onclick="if (event.target === this) closePdfDialog()">
    <div class="pdf-modal" role="dialog" aria-modal="true" aria-labelledby="pdf-title">
      <div class="pdf-head">
        <div class="pdf-head-icon"><svg class="icon"><use href="#icon-download" /></svg></div>
        <div class="pdf-title" id="pdf-title">Baixar o manual em PDF</div>
      </div>
      <div class="pdf-body">
        <button class="pdf-option" onclick="printManual('all')">
          <strong>Manual completo</strong>
          <span>Capa, sumário e todas as seções, prontos para imprimir ou guardar.</span>
        </button>
        <button class="pdf-option" onclick="printManual('current')">
          <strong>Somente esta página</strong>
          <span id="pdf-current-label">A página aberta agora.</span>
        </button>
        <p class="pdf-hint">Na janela de impressão, escolha <strong>Salvar como PDF</strong> no campo “Destino”. Para o melhor resultado, use o Google Chrome.</p>
      </div>
      <div class="pdf-actions">
        <button class="nav-action-btn" onclick="closePdfDialog()">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Print-only document, built on demand -->
  <div id="print-root" aria-hidden="true"></div>
